
{% extends "learning_logs/base.html" %}
{% block content %}

{% if form.errors %}
<p>输入的名字与密码不匹配，重新输入名字或密码。</p>
{% endif %}

<form action="{% url 'accounts:login' %}" method='post'>
    {% csrf_token %}
    {{ form.as_div }}
    <button type='submit'>登录</button>

</form>

{% endblock content %}
<!--button按钮触发提交动作，然后accounts下的login函数执行登录动作。而这个函数是django 内置的。-->
